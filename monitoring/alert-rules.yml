groups:
  - name: taskflow
    rules:
      - alert: TaskFlowDown
        expr: up{job=~"taskflow-.*"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "TaskFlow target is down"
          description: "Prometheus cannot scrape {{ $labels.job }} for more than 15 seconds."

      - alert: TaskFlowInvalidLoginSpike
        expr: increase(taskflow_login_attempts_total{result="failure"}[1m]) >= 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Spike of invalid TaskFlow logins"
          description: "At least 5 failed login attempts in the last minute on {{ $labels.job }}."

      - alert: TaskFlowHighErrorRate
        expr: |
          (
            sum(rate(taskflow_http_requests_total{status_code=~"5.."}[2m]))
            /
            clamp_min(sum(rate(taskflow_http_requests_total[2m])), 0.001)
          ) > 0.2
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx rate on TaskFlow"
          description: "More than 20% of recent requests returned 5xx."
