global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['taskflow-alertmanager:9093', 'alertmanager:9093']

scrape_configs:
  - job_name: taskflow-production
    metrics_path: /metrics
    static_configs:
      - targets: ['taskflow-production:3000', 'host.docker.internal:3002']
        labels:
          env: production

  - job_name: taskflow-staging
    metrics_path: /metrics
    static_configs:
      - targets: ['taskflow-staging:3000', 'host.docker.internal:3001']
        labels:
          env: staging
