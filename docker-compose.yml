services:
  taskflow-staging:
    image: taskflow-api:${IMAGE_TAG:-staging}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taskflow-staging
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: staging
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PORT: 3000
    restart: unless-stopped

  taskflow-production:
    image: taskflow-api:${IMAGE_TAG:-production}
    container_name: taskflow-production
    ports:
      - "3002:3000"
    environment:
      NODE_ENV: production
      APP_VERSION: ${APP_VERSION:-1.0.0}
      PORT: 3000
    restart: unless-stopped
    profiles:
      - production

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: taskflow-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    profiles:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: taskflow-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    profiles:
      - monitoring
